[project]
name = "duyi-utils"
version = "0.1.0"
description = "渡一公共工具包"
requires-python = ">=3.14"
dependencies = [
    "oss2==2.19.0",
    "pyjwt==2.10.1",
    "bcrypt==4.3.0",
    "openai==2.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duyi_utils"]
